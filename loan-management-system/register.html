<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Loan Management System</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <a href="index.html" class="logo">
                    Loan<span>Manager</span>
                </a>

                <h1>Create Your Account</h1>

                <p>
                    Register to start managing your loans.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <div id="registerMessage" class="form-message"></div>


                <button type="submit" class="btn btn-primary btn-full">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>
</html>
