<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Desk — Manage Staff</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Loan Desk</div>
    <div class="sidebar-user">
      <div class="name" id="sidebarName">—</div>
      <div class="role" id="sidebarRole">—</div>
    </div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="find-customer.html" data-staff-only>Customers</a>
      <a href="calculator.html">Calculator</a>
      <a href="activity-log.html" data-admin-only>Activity Log</a>
      <a href="manage-staff.html" class="active" data-admin-only>Manage Staff</a>
    </nav>
    <div class="sidebar-footer">
      <button class="logout-link">Log out</button>
    </div>
  </aside>

  <div class="content">
    <div class="main">
      <div class="page-head"><h1>Manage staff</h1></div>

      <div class="form-card">
        <div class="grid">
          <div class="field"><label>Username</label><input id="username" /></div>
                    <div class="field">
            <label>Password</label>
            <div class="password-wrap">
              <input id="password" type="password" />
              <button type="button" class="password-toggle" onclick="togglePassword()">Show</button>
            </div>
          </div>
          <div class="field"><label>Role</label>
            <select id="role">
              <option value="staff">Staff</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>
        <button class="btn" onclick="createUser()">Create account</button>
        <div id="banner" class="banner"></div>
      </div>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
requirePageRole(['admin']);

const user = currentUser();
document.getElementById('sidebarName').textContent = user.username;
document.getElementById('sidebarRole').textContent = user.role;

function setBanner(kind, text) {
  const el = document.getElementById('banner');
  el.className = 'banner show ' + kind;
  el.textContent = text;
}
function clearBanner() { document.getElementById('banner').className = 'banner'; }
function togglePassword() {
  const input = document.getElementById('password');
  const btn = document.querySelector('.password-toggle');
  const isHidden = input.type === 'password';
  input.type = isHidden ? 'text' : 'password';
  btn.textContent = isHidden ? 'Hide' : 'Show';
}

async function createUser() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;

  if (!username || !password) {
    setBanner('fail', 'Username and password are required.');
    return;
  }

  setBanner('pending', 'Creating…');

  try {
    const res = await fetch(baseUrl + '/create_user.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, role })
    });

    if (res.status === 401) {
      window.location.href = 'login.html';
      return;
    }
    if (res.status === 403) {
      setBanner('fail', "You don't have permission to do this.");
      return;
    }

    const data = await res.json();
    if (!res.ok || data.success === false) {
      setBanner('fail', data.message || 'Could not create account.');
      return;
    }

    setBanner('success', 'Account created (user #' + data.user_id + ').');
    document.getElementById('username').value = '';
    document.getElementById('password').value = '';
    document.getElementById('role').value = 'staff';
  } catch (err) {
    setBanner('fail', 'Request failed: ' + err.message);
  }
}
</script>
</body>
</html>
