<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loan Desk — New loan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <span class="brand">Loan Desk</span>
  <div>
    <nav style="display:inline">
      <a href="dashboard.html">Dashboard</a>
      <a href="calculator.html">Calculator</a>
      <a href="find-customer.html" class="active">New loan</a>
      <a href="activity-log.html" data-admin-only>Activity Log</a>
      <a href="manage-staff.html" data-admin-only>Manage Staff</a>
    </nav>
    <span class="who" id="whoLabel">—</span>
    <button class="logout-link">Log out</button>
  </div>
</div>

<div class="main">
  <h1>Create a loan</h1>
  <p class="lede">Saves the loan and full payment schedule to the database, starting from today.</p>

  <div id="customerBanner" style="background: var(--gold-soft); border-radius: 9px; padding: 10px 14px; font-size: 13.5px; margin-bottom: 16px;"></div>

  <div class="form-card">
    <div class="grid">
      <div class="field"><label>Amount</label><input id="amount" value="50000" /></div>
      <div class="field"><label>Rate (%)</label><input id="rate" value="12" /></div>
      <div class="field"><label>Years</label><input id="years" value="1" /></div>
      <div class="field"><label>Frequency</label>
        <select id="frequency"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select>
      </div>
      <div class="field"><label>Method</label>
        <select id="method"><option value="reducing">Reducing balance</option><option value="flat">Flat interest</option></select>
      </div>
    </div>
    <button class="btn" onclick="createLoan()">Save loan</button>
    <div id="banner" class="banner"></div>
    <div id="stats" class="stats"></div>
  </div>

  <div id="scheduleWrap" style="display:none;">
    <h3 style="font-family: var(--serif); font-size: 17px; margin: 0 0 10px;">Payment schedule</h3>
    <table id="scheduleTable">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="js/app.js"></script>
<script>
requirePageLogin();

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

const selectedCustomerId = sessionStorage.getItem('selectedCustomerId');
const selectedCustomerName = sessionStorage.getItem('selectedCustomerName');

if (!selectedCustomerId) {
  window.location.href = 'find-customer.html';
}

document.getElementById('customerBanner').textContent = 'Creating loan for: ' + selectedCustomerName;

function setBanner(kind, text) {
  const el = document.getElementById('banner');
  el.className = 'banner show ' + kind;
  el.textContent = text;
}

function renderStats(result) {
  const el = document.getElementById('stats');
  el.className = 'stats show';
  el.innerHTML =
    '<div class="stat hero"><div class="label">Installment</div><div class="value">' + result.installment_amount + '</div></div>' +
    '<div class="stat"><div class="label">Principal</div><div class="value">' + result.principal + '</div></div>' +
    '<div class="stat"><div class="label">Interest</div><div class="value">' + result.interest + '</div></div>' +
    '<div class="stat"><div class="label">Total payable</div><div class="value">' + result.total_payable + '</div></div>' +
    '<div class="stat"><div class="label">Installments</div><div class="value">' + result.number_of_installments + '</div></div>';
}

function renderSchedule(schedule) {
  const wrap = document.getElementById('scheduleWrap');
  const thead = document.querySelector('#scheduleTable thead');
  const tbody = document.querySelector('#scheduleTable tbody');

  if (!schedule || schedule.length === 0) {
    wrap.style.display = 'none';
    return;
  }

  const hasComponents = schedule[0].hasOwnProperty('principal_component');

  thead.innerHTML = hasComponents
    ? '<tr><th>Period</th><th>Due date</th><th>Installment</th><th>Principal</th><th>Interest</th><th>Balance left</th></tr>'
    : '<tr><th>Period</th><th>Due date</th><th>Installment</th><th>Balance left</th></tr>';

  tbody.innerHTML = schedule.map(row => {
    const dueDate = escapeHtml(row.due_date || '');
    if (hasComponents) {
      return '<tr><td>' + row.period + '</td><td>' + dueDate + '</td><td>' + row.installment_amount + '</td><td>' +
        row.principal_component + '</td><td>' + row.interest_component + '</td><td>' +
        row.remaining_balance + '</td></tr>';
    }
    return '<tr><td>' + row.period + '</td><td>' + dueDate + '</td><td>' + row.installment_amount + '</td><td>' +
      row.remaining_balance + '</td></tr>';
  }).join('');

  wrap.style.display = 'block';
}

async function createLoan() {
  setBanner('pending', 'Saving…');
  document.getElementById('stats').className = 'stats';

  try {
    const res = await fetch(baseUrl + '/create_loan.php', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        customer_id: Number(selectedCustomerId),
        amount: Number(document.getElementById('amount').value),
        rate: Number(document.getElementById('rate').value),
        years: Number(document.getElementById('years').value),
        frequency: document.getElementById('frequency').value,
        method: document.getElementById('method').value
      })
    });

    if (res.status === 401) {
      window.location.href = 'login.html';
      return;
    }

    const data = await res.json();
    if (!res.ok || data.success === false) {
      setBanner('fail', data.message || 'Something went wrong.');
      return;
    }
    setBanner('ok', 'Loan #' + data.loan_id + ' saved.');
    renderStats(data.data);
    renderSchedule(data.schedule);
  } catch (err) {
    setBanner('fail', 'Request failed: ' + err.message);
  }
}
</script>
</body>
</html>
