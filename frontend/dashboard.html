<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loan Desk — Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">Loan Desk</div>
        <div class="sidebar-user">
          <div class="name" id="sidebarName">—</div>
          <div class="role" id="sidebarRole">—</div>
        </div>
        <nav>
          <a href="dashboard.html" class="active">Dashboard</a>
          <a href="find-customer.html" data-staff-only>Customers</a>
          <a href="calculator.html">Calculator</a>
          <a href="activity-log.html" data-admin-only>Activity Log</a>
          <a href="manage-staff.html" data-admin-only>Manage Staff</a>
        </nav>
        <div class="sidebar-footer">
          <button class="logout-link">Log out</button>
        </div>
      </aside>

      <div class="content">
        <div class="main wide">
          <div class="page-head">
            <h1>Dashboard</h1>
            <span class="today" id="todayLabel"></span>
          </div>

          <div class="stats-row">
            <div class="stat-box">
              <div class="stat-label">Customers</div>
              <div class="stat-value" id="statCustomers">—</div>
            </div>
            <div class="stat-box" id="statStaffBox">
              <div class="stat-label">Staff</div>
              <div class="stat-value" id="statStaff">—</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Loans today</div>
              <div class="stat-value" id="statLoansToday">—</div>
            </div>
          </div>

                <div class="ledger-list">
        <a href="find-customer.html" class="ledger-item" data-staff-only>
          <span class="ledger-tag">CUST</span>
          <div><h3>Find / Register Customer</h3></div>
        </a>
        <a href="calculator.html" class="ledger-item" data-staff-only>
          <span class="ledger-tag">CALC</span>
          <div><h3>Calculator</h3></div>
        </a>
        <a href="loan.html" class="ledger-item" data-staff-only>
          <span class="ledger-tag">LOAN</span>
          <div><h3>New Loan</h3></div>
        </a>
        <a href="all-customers.html" class="ledger-item">
          <span class="ledger-tag">CUST</span>
          <div><h3>All Customers</h3></div>
        </a>
        <a href="activity-log.html" class="ledger-item" data-admin-only>
          <span class="ledger-tag">STAFF</span>
          <div><h3>Staff</h3></div>
        </a>
        <a href="loans-today.html" class="ledger-item" data-admin-only>
          <span class="ledger-tag">LOAN</span>
          <div><h3>Loans Today</h3></div>
        </a>
      </div>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
    <script>
      requirePageLogin();

      document.getElementById("todayLabel").textContent =
        new Date().toLocaleDateString(undefined, {
          weekday: "long",
          year: "numeric",
          month: "long",
          day: "numeric",
        });

      const user = currentUser();
      document.getElementById("sidebarName").textContent = user.username;
      document.getElementById("sidebarRole").textContent = user.role;

      if (user.role === "admin") {
        document
          .querySelectorAll("[data-staff-only]")
          .forEach((el) => (el.style.display = "none"));
      }
      if (user.role === "staff") {
        document.getElementById("statStaffBox").style.display = "none";
      }

      async function loadStats() {
        try {
          const res = await fetch(baseUrl + "/get_dashboard_stats.php", {
            credentials: "include",
          });
          if (res.status === 401) {
            window.location.href = "login.html";
            return;
          }
          const data = await res.json();
          if (data.success) {
            document.getElementById("statCustomers").textContent =
              data.customers;
            document.getElementById("statStaff").textContent = data.staff;
            document.getElementById("statLoansToday").textContent =
              data.loans_today;
          }
        } catch (err) {
          // Fail quietly - stats are a nice-to-have, not critical
        }
      }

      loadStats();
    </script>
  </body>
</html>
